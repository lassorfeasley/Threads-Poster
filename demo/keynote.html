<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Threads Poster — Demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
@font-face { font-family: "Funnel Sans"; src: url("fonts/FunnelSans-Variable.ttf"); font-weight: 300 800; }
@font-face { font-family: "Funnel Display"; src: url("fonts/FunnelDisplay-SemiBold.ttf"); font-weight: 600; }
@font-face { font-family: "Funnel Display"; src: url("fonts/FunnelDisplay-Bold.ttf"); font-weight: 700; }
@font-face { font-family: "Funnel Display"; src: url("fonts/FunnelDisplay-ExtraBold.ttf"); font-weight: 800; }

/* Day mode: the app's own light theme tokens (app/web/static/style.css). */
:root {
  --bg: #f3f2ef; --bg-raised: #f8f7f5; --panel: #ffffff; --panel2: #eeece8; --panel3: #e5e2dc;
  --border: #e5e2dc; --border-strong: #d3cfc7;
  --text: #0d0d0d; --text-dim: #45464c; --muted: #7f7c75;
  --accent: #16794c; --accent-soft: rgba(22,121,76,.1); --accent-border: rgba(22,121,76,.36);
  --danger: #c63a2f; --danger-soft: rgba(198,58,47,.09); --danger-border: rgba(198,58,47,.38);
  --warn: #a2690f; --warn-soft: rgba(162,105,15,.11); --warn-border: rgba(162,105,15,.38);
  --shadow-lift: 0 2px 6px rgba(28,24,18,.06), 0 22px 44px -20px rgba(28,24,18,.25);
  /* Programming categories (validated categorical palette, light surface) */
  --c-news: #2a78d6; --c-nature: #1baa7c; --c-culture: #8b5bd6; --c-promo: #eb6834;
  /* Diverging pair for lift vs. baseline */
  --pos: #2a78d6; --neg: #d9534a;
  --ease: cubic-bezier(.2,.8,.2,1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: #e6e3dd; overflow: hidden; cursor: default; }
body { font-family: "Funnel Sans", -apple-system, system-ui, sans-serif; color: var(--text); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: default; }

/* ---------- stage ---------- */
#stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: center; overflow: hidden;
  background: radial-gradient(1100px 760px at 18% 28%, rgba(22,121,76,.09), transparent 62%),
              radial-gradient(900px 700px at 92% 88%, rgba(42,120,214,.07), transparent 60%),
              radial-gradient(800px 600px at 70% 10%, rgba(255,255,255,.9), transparent 60%), #efede8; }

/* ---------- browser ---------- */
#browser { position: absolute; left: 72px; top: 92px; width: 1200px; height: 896px; border-radius: 16px; overflow: hidden; background: var(--bg);
  box-shadow: 0 0 0 1px rgba(28,24,18,.10), 0 50px 110px -30px rgba(40,30,20,.40), 0 18px 36px -12px rgba(40,30,20,.18);
  transition: opacity .7s var(--ease), transform .7s var(--ease); }
#stage.is-title #browser { opacity: 0; transform: translateY(40px) scale(.96); }
.chrome { height: 52px; background: #e9e7e2; border-bottom: 1px solid #d9d6cf; display: flex; align-items: center; padding: 0 18px; gap: 18px; }
.lights { display: flex; gap: 8px; }
.lights i { width: 12px; height: 12px; border-radius: 50%; display: block; }
.lights i:nth-child(1){ background:#ff5f57 } .lights i:nth-child(2){ background:#febc2e } .lights i:nth-child(3){ background:#28c840 }
.navarrows { display: flex; gap: 14px; color: #a09c94; font-size: 18px; }
.urlbar { flex: 1; margin: 0 120px 0 40px; height: 32px; border-radius: 8px; background: #fff; border: 1px solid #dcd9d2; display: flex; align-items: center; justify-content: center;
  color: var(--text-dim); font-size: 14px; gap: 8px; }
.urlbar svg { opacity: .5 }
#vp { position: absolute; top: 52px; left: 0; right: 0; bottom: 0; overflow: hidden; }
#content { position: absolute; inset: 0; transition: opacity .35s var(--ease); }
#content.out { opacity: 0; }

/* ---------- right column ---------- */
#copy { position: absolute; left: 1350px; top: 0; width: 490px; height: 1080px; display: flex; flex-direction: column; justify-content: center;
  transition: opacity .5s var(--ease), transform .5s var(--ease); }
#copy.out { opacity: 0; transform: translateX(20px); }
#stage.is-title #copy { opacity: 0; pointer-events: none; }
.kicker { font-size: 18px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); font-weight: 700; margin-bottom: 22px; }
.headline { font-family: "Funnel Display"; font-weight: 700; font-size: 62px; line-height: 1.04; letter-spacing: -.02em; }
.sub { margin-top: 26px; font-size: 25px; line-height: 1.4; color: var(--text-dim); }

#dots { position: absolute; left: 1350px; bottom: 92px; display: flex; gap: 10px; align-items: center; transition: opacity .5s; }
#dots i { width: 10px; height: 10px; border-radius: 6px; background: rgba(28,24,18,.16); transition: all .45s var(--ease); cursor: pointer; }
#dots i.on { width: 34px; background: var(--accent); }
#dots i.done { background: rgba(28,24,18,.38); }
#stage.is-title #dots { left: 50%; transform: translateX(-50%); }

/* ---------- title ---------- */
#title { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  transition: opacity .7s var(--ease), transform .7s var(--ease); }
#stage:not(.is-title) #title { opacity: 0; transform: scale(1.04); pointer-events: none; }
#title .mark { width: 92px; height: 92px; border-radius: 26px; background: var(--accent); display: grid; place-items: center; margin-bottom: 40px;
  box-shadow: 0 20px 50px -14px rgba(22,121,76,.55); }
#title h1 { font-family: "Funnel Display"; font-weight: 800; font-size: 132px; letter-spacing: -.035em; line-height: 1; }
#title p { margin-top: 30px; font-size: 32px; color: var(--text-dim); max-width: 1200px; line-height: 1.35; }
#title .by { margin-top: 48px; font-size: 20px; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; }
#title .cats { margin-top: 34px; display: flex; gap: 12px; justify-content: center; }
#title .cats .cat { font-size: 18px; height: 40px; padding: 0 18px; border-radius: 20px; }
#title .cats .cat i { width: 10px; height: 10px; }

#hint { position: absolute; left: 72px; bottom: 34px; font-size: 15px; color: var(--muted); transition: opacity 1s; }

/* ---------- cursor ---------- */
#cursor { position: absolute; left: 0; top: 0; width: 26px; height: 32px; z-index: 50; pointer-events: none; transform: translate(900px, 700px);
  transition-property: transform, opacity; transition-timing-function: cubic-bezier(.45,.05,.25,1); filter: drop-shadow(0 2px 3px rgba(0,0,0,.3)); opacity: 0; }
#cursor svg { transition: transform .12s; transform-origin: 4px 3px; }
#cursor.down svg { transform: scale(.82); }
.ripple { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; border: 2px solid rgba(22,121,76,.55);
  pointer-events: none; z-index: 49; animation: ripple .55s ease-out forwards; }
@keyframes ripple { from { transform: scale(.3); opacity: 1 } to { transform: scale(1.4); opacity: 0 } }

/* ---------- app shell ---------- */
.app { position: absolute; inset: 0; display: flex; background: var(--bg); font-size: 15px; }
.rail { width: 68px; flex: none; border-right: 1px solid var(--border); background: var(--bg-raised); display: flex; flex-direction: column; align-items: center; padding: 16px 0; gap: 6px; }
.rail .logo { width: 34px; height: 34px; border-radius: 10px; background: var(--accent); margin-bottom: 18px; display: grid; place-items: center; }
.rail .ic { width: 44px; height: 40px; border-radius: 10px; display: grid; place-items: center; color: var(--muted); }
.rail .ic.on { background: #fff; color: var(--text); box-shadow: 0 0 0 1px var(--border-strong); }
.rail .sp { flex: 1 }
.main { flex: 1; padding: 34px 40px; overflow: hidden; position: relative; }
.pt { font-family: "Funnel Display"; font-weight: 700; font-size: 30px; letter-spacing: -.01em; }
.lede { color: var(--muted); margin-top: 6px; font-size: 15px; display: flex; align-items: center; gap: 8px; }
.btn { height: 38px; padding: 0 18px; border-radius: 10px; background: var(--panel); border: 1px solid var(--border-strong); font-weight: 600; font-size: 14px;
  display: inline-flex; align-items: center; gap: 8px; transition: transform .12s, background .2s, color .2s, border-color .2s; white-space: nowrap; }
.btn.primary { background: var(--text); color: #fff; border-color: var(--text); }
.btn.accent { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn.pressed { transform: scale(.95); }
.btn.ok { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-border); }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 1px 2px rgba(28,24,18,.04); }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 13px; font-size: 13px; font-weight: 600;
  background: var(--panel2); border: 1px solid var(--border-strong); color: var(--text-dim); white-space: nowrap; transition: all .25s; }
.chip.g { background: var(--accent-soft); border-color: var(--accent-border); color: var(--accent); }
.cat { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px; border-radius: 11px; font-size: 12px; font-weight: 600; color: var(--text-dim);
  background: var(--panel); border: 1px solid var(--border-strong); white-space: nowrap; }
.cat i { width: 8px; height: 8px; border-radius: 50%; display: block; flex: none; }
.hidden { display: none !important; }
.fade { opacity: 0; transform: translateY(8px); transition: opacity .45s var(--ease), transform .45s var(--ease); }
.fade.in { opacity: 1; transform: none; }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .7s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg) } }
.caret { display: inline-block; width: 2px; height: 1.1em; background: var(--accent); vertical-align: -3px; margin-left: 1px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0 } }
.lbl { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }

/* ---------- scenes (footage placeholders) ---------- */
.scene { position: relative; overflow: hidden; border-radius: 8px; background: #ccc; }
.scene svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.l3 { position: absolute; left: 6%; right: 18%; bottom: 9%; display: flex; font-weight: 700; letter-spacing: .02em; text-transform: uppercase; }
.l3 b { background: #d42a2a; color: #fff; padding: .25em .5em; }
.l3 span { background: rgba(255,255,255,.94); color: #111; padding: .25em .6em; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bug { position: absolute; right: 4%; top: 6%; color: rgba(255,255,255,.9); font-weight: 800; font-size: .9em; letter-spacing: .04em; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
.subs { position: absolute; left: 0; right: 0; bottom: 8%; text-align: center; }
.subs span { background: rgba(0,0,0,.72); color: #fff; padding: .2em .55em; border-radius: .25em; font-weight: 600; }

/* ---------- slide: onboarding ---------- */
.steps { display: flex; gap: 8px; margin-bottom: 20px; }
.steps span { font-size: 13px; font-weight: 600; color: var(--muted); padding: 6px 12px; border-radius: 20px; border: 1px solid var(--border-strong); }
.steps span.on { color: var(--text); background: #fff; }
.steps span.done { color: var(--accent); border-color: var(--accent-border); }
.form { margin-top: 22px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px 22px; }
.f { display: flex; flex-direction: column; gap: 7px; }
.f.wide { grid-column: span 2; }
.f > span { font-size: 13px; font-weight: 600; color: var(--text-dim); }
.in { min-height: 46px; border-radius: 10px; background: var(--panel); border: 1px solid var(--border-strong); padding: 12px 14px; font-size: 16px; line-height: 1.4;
  transition: border-color .2s, box-shadow .2s; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.in.tall { min-height: 76px; align-items: flex-start; }
.in.focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.in .ph { color: #b0aca4; }
.mix { display: flex; gap: 10px; }
.mix .opt { flex: 1; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--panel); display: flex; gap: 10px; align-items: center;
  font-size: 14px; font-weight: 600; color: var(--text-dim); transition: all .25s; }
.mix .opt i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.mix .opt small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; margin-top: 1px; }
.mix .opt .tick { margin-left: auto; width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--border-strong); display: grid; place-items: center; color: #fff; transition: all .2s; flex: none; }
.mix .opt.on { border-color: var(--accent-border); color: var(--text); box-shadow: 0 0 0 3px var(--accent-soft); }
.mix .opt.on .tick { background: var(--accent); border-color: var(--accent); }
.actions { margin-top: 22px; display: flex; justify-content: flex-end; gap: 12px; }

/* ---------- slide: channels ---------- */
.scanbar { margin-top: 22px; display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; }
.scan-l { display: flex; align-items: center; gap: 12px; color: var(--text-dim); }
.pdot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
.pdot.live { background: var(--accent); box-shadow: 0 0 0 0 rgba(22,121,76,.5); animation: pulse 1.4s infinite; }
@keyframes pulse { 70% { box-shadow: 0 0 0 10px rgba(22,121,76,0) } 100% { box-shadow: 0 0 0 0 rgba(22,121,76,0) } }
.prog { height: 3px; background: var(--panel3); border-radius: 2px; margin-top: 10px; overflow: hidden; }
.prog i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 3.2s linear; }
.list { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
.row { display: grid; grid-template-columns: 44px 1.45fr 96px 1.35fr 140px 24px; align-items: center; gap: 14px; padding: 10px 16px; }
.av { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; font-weight: 800; font-size: 12px; color: #fff; letter-spacing: .02em; }
.row .nm b { display: block; font-size: 15px; } .row .nm small { color: var(--muted); font-size: 13px; }
.row .stt { font-size: 13px; color: var(--text-dim); } .row .stt small { display: block; color: var(--muted); }
.meter { height: 6px; border-radius: 3px; background: var(--panel3); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.mlabel { font-size: 12px; color: var(--muted); margin-top: 5px; }
.chk { width: 22px; height: 22px; border-radius: 6px; background: var(--accent); display: grid; place-items: center; color: #fff; }
.foot { position: absolute; left: 40px; right: 40px; bottom: 28px; display: flex; justify-content: space-between; align-items: center; color: var(--text-dim); }

/* ---------- slide: accounts ---------- */
.accgrid { margin-top: 28px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.acc { padding: 20px; display: flex; gap: 16px; align-items: center; transition: border-color .3s; }
.acc.on { border-color: var(--accent-border); }
.acc .lg { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; font-weight: 800; font-size: 22px; flex: none; }
.acc .tx { flex: 1; } .acc .tx b { font-size: 17px; display: block; } .acc .tx small { color: var(--muted); font-size: 13px; line-height: 1.4; display: block; margin-top: 3px; }
.acc .stat { font-size: 13px; color: var(--accent); font-weight: 600; margin-top: 6px; display: none; align-items: center; gap: 6px; }
.acc.on .stat { display: flex; }
.acc.wide { grid-column: span 2; }

/* ---------- slide: triage ---------- */
.tri { display: grid; grid-template-columns: 370px 1fr; gap: 22px; margin-top: 20px; height: 690px; }
.q { display: flex; flex-direction: column; gap: 9px; }
.qc { padding: 9px; display: grid; grid-template-columns: 112px 1fr; gap: 12px; transition: border-color .25s, opacity .4s, transform .4s; }
.qc.sel { border-color: var(--text); box-shadow: 0 0 0 1px var(--text); }
.qc.gone { opacity: .4; }
.qc .scene { height: 63px; font-size: 6px; }
.qc b { font-size: 13px; line-height: 1.3; display: block; }
.qc small { color: var(--muted); font-size: 12px; display: flex; gap: 6px; align-items: center; margin-top: 4px; }
.prob { margin-top: 5px; font-size: 12px; font-weight: 700; }
.detail { padding: 22px; display: flex; flex-direction: column; gap: 15px; position: relative; }
.detail .hero { height: 272px; font-size: 13px; }
.film { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
.film .scene { height: 50px; border-radius: 4px; font-size: 4px; }
.film-lbl { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.tr { font-size: 14px; color: var(--text-dim); line-height: 1.5; background: var(--bg-raised); border-radius: 10px; padding: 12px 14px; border: 1px solid var(--border); }
.tr mark { background: var(--accent-soft); color: var(--accent); border-radius: 3px; padding: 0 3px; }
.dbar { display: flex; gap: 10px; align-items: center; }
.toast { position: absolute; right: 22px; bottom: 22px; padding: 14px 18px; display: flex; gap: 12px; align-items: center; font-size: 14px; z-index: 5;
  box-shadow: var(--shadow-lift); background: var(--panel); border: 1px solid var(--border-strong); border-radius: 12px; }
.toast small { display: block; color: var(--muted); font-size: 12.5px; margin-top: 2px; }

/* ---------- slide: cut ---------- */
.cut { display: grid; grid-template-columns: 1fr 330px; gap: 22px; margin-top: 18px; }
.player { height: 380px; font-size: 16px; border-radius: 12px; }
.tl { margin-top: 16px; padding: 14px; }
.tl-frames { position: relative; display: grid; grid-template-columns: repeat(8,1fr); gap: 2px; height: 56px; border-radius: 6px; overflow: hidden; }
.tl-frames .scene { border-radius: 0; height: 56px; font-size: 3px; }
.wave { display: flex; align-items: center; gap: 2px; height: 34px; margin-top: 8px; }
.wave i { flex: 1; background: var(--panel3); border-radius: 1px; }
.tl-inner { position: relative; }
.selbox { position: absolute; top: -4px; bottom: -4px; border: 2px solid var(--accent); border-radius: 8px; background: rgba(22,121,76,.12);
  opacity: 0; transition: left .9s var(--ease), width .9s var(--ease), opacity .3s; pointer-events: none; }
.selbox.in { opacity: 1; }
.selbox .h { position: absolute; top: 50%; width: 10px; height: 34px; margin-top: -17px; background: var(--accent); border-radius: 4px; }
.selbox .h.l { left: -6px } .selbox .h.r { right: -6px }
.tl-times { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin-top: 8px; }
.sugs { display: flex; flex-direction: column; gap: 10px; }
.sug { padding: 14px; transition: border-color .25s, background .25s; }
.sug.sel { border-color: var(--accent-border); background: rgba(22,121,76,.05); }
.sug b { font-size: 14.5px; display: block; } .sug p { font-size: 13px; color: var(--text-dim); margin-top: 6px; line-height: 1.45; }
.sug .meta { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.outs { display: flex; gap: 12px; align-items: flex-end; }
.outs .scene { font-size: 4px; }

/* ---------- slide: post ---------- */
.post { display: grid; grid-template-columns: 400px 1fr; gap: 24px; margin-top: 20px; }
.post .prev { height: 225px; font-size: 11px; }
.capbox { min-height: 140px; font-size: 17px; line-height: 1.5; display: block; }
.capbox .v { white-space: pre-wrap; }
.checks { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.check { display: flex; gap: 10px; align-items: center; font-size: 14px; color: var(--text-dim); }
.check .ico { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--panel2); flex: none; }
.check.ok .ico { background: var(--accent-soft); color: var(--accent); }
.tog { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; }
.sw { width: 40px; height: 24px; border-radius: 12px; background: var(--panel3); position: relative; transition: background .25s; }
.sw::after { content: ""; position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .25s var(--ease); box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.sw.on { background: var(--accent); } .sw.on::after { transform: translateX(16px); }
.promo { background: #fffaf3; border-color: rgba(235,104,52,.35); }

/* ---------- slide: calendar ---------- */
.calwrap { display: grid; grid-template-columns: 1fr 252px; gap: 18px; margin-top: 16px; }
.cal { display: grid; grid-template-columns: 54px repeat(7, 1fr); gap: 6px; }
.cal .hd { font-size: 12px; font-weight: 700; color: var(--muted); text-align: center; padding-bottom: 4px; }
.cal .hd b { display: block; font-size: 18px; color: var(--text); font-family: "Funnel Display"; }
.cal .hd.today b { color: var(--accent); }
.cal .tm { font-size: 12px; color: var(--muted); padding-top: 10px; text-align: right; padding-right: 6px; }
.slot { height: 140px; border-radius: 10px; border: 1px dashed var(--border-strong); position: relative; transition: background .3s, border-color .3s; }
.slot.past .pc { opacity: .55; }
.pc { position: absolute; inset: 4px; border-radius: 8px; padding: 6px; display: flex; flex-direction: column; gap: 4px; overflow: hidden; background: var(--panel);
  border: 1px solid var(--border); border-top: 3px solid var(--cc, var(--border)); box-shadow: 0 1px 2px rgba(28,24,18,.05); }
.pc .scene { height: 44px; border-radius: 5px; font-size: 3px; flex: none; }
.pc b { font-size: 11.5px; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pc .meta { display: flex; justify-content: space-between; align-items: center; font-size: 10.5px; color: var(--muted); margin-top: auto; }
.pc .meta span { display: flex; align-items: center; gap: 4px; }
.pc .meta i { width: 7px; height: 7px; border-radius: 50%; display: block; }
.pc.land { animation: land .9s var(--ease); }
@keyframes land { 0% { box-shadow: 0 0 0 8px rgba(22,121,76,.25); } 100% { box-shadow: 0 0 0 0 rgba(22,121,76,0); } }
.slot.consider { border-color: var(--danger); border-style: solid; background: var(--danger-soft); }
.slot .nope { position: absolute; inset: 4px; border-radius: 8px; display: grid; place-items: center; text-align: center; font-size: 11px; font-weight: 700; color: var(--danger); padding: 6px; line-height: 1.3; }
.why { position: absolute; width: 340px; padding: 16px; z-index: 6; box-shadow: var(--shadow-lift); background: var(--panel); border: 1px solid var(--border-strong); border-radius: 12px; }
.why h4 { font-size: 14px; margin-bottom: 6px; }
.why li { list-style: none; display: flex; gap: 8px; font-size: 13px; color: var(--text-dim); margin-top: 7px; line-height: 1.4; }
.why li i { color: var(--accent); font-style: normal; font-weight: 800; }
.why li.x i { color: var(--danger); }
.qside { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.qitem { padding: 8px; border-radius: 10px; background: var(--bg-raised); border: 1px solid var(--border-strong); }
.qitem .scene { height: 104px; font-size: 6px; }
.qitem b { font-size: 13px; display: block; margin-top: 8px; line-height: 1.3; }
.qitem small { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; margin-top: 4px; }
.mixbar { display: flex; height: 14px; border-radius: 4px; overflow: hidden; gap: 2px; background: var(--panel); }
.mixbar i { display: block; height: 100%; transition: flex-grow .8s var(--ease); }
.mixleg { display: grid; grid-template-columns: 1fr auto; gap: 6px 8px; font-size: 12.5px; color: var(--text-dim); margin-top: 10px; }
.mixleg span { display: flex; align-items: center; gap: 6px; }
.mixleg span i { width: 8px; height: 8px; border-radius: 50%; display: block; }
.mixleg b { font-weight: 700; color: var(--text); text-align: right; }
.flyer { position: absolute; z-index: 40; transition: all 1.1s cubic-bezier(.6,.0,.2,1); }

/* ---------- slide: threads (light) ---------- */
.th { position: absolute; inset: 0; background: #fafafa; display: flex; justify-content: center; font-family: -apple-system, "Helvetica Neue", system-ui, sans-serif; color: #000; }
.th-rail { position: absolute; left: 0; top: 0; bottom: 0; width: 76px; display: flex; flex-direction: column; align-items: center; padding-top: 22px; gap: 30px; color: #b8b8b8; }
.th-col { width: 620px; margin-top: 16px; background: #fff; border: 1px solid #e5e5e5; border-radius: 26px 26px 0 0; padding: 26px 0 0; overflow: hidden; position: relative; box-shadow: 0 0 12px rgba(0,0,0,.04); }
.th-prof { padding: 0 26px; display: flex; justify-content: space-between; align-items: center; }
.th-prof h2 { font-size: 24px; font-weight: 700; }
.th-prof .hd { font-size: 15px; color: #000; margin-top: 2px; }
.th-bio { padding: 12px 26px 0; font-size: 15px; line-height: 1.4; }
.th-meta { padding: 12px 26px 0; font-size: 15px; color: #999; }
.th-av { width: 72px; height: 72px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; }
.th-tabs { display: grid; grid-template-columns: repeat(3,1fr); margin-top: 18px; border-bottom: 1px solid #e5e5e5; }
.th-tabs span { text-align: center; padding: 12px; font-size: 15px; font-weight: 600; color: #999; }
.th-tabs span.on { color: #000; border-bottom: 1px solid #000; }
.th-feed { position: relative; }
.th-new { max-height: 0; overflow: hidden; opacity: 0; transition: max-height 1.1s var(--ease), opacity .6s var(--ease) .15s; }
.th-new.shown { max-height: 780px; opacity: 1; }
.tp { padding: 16px 22px; display: grid; grid-template-columns: 40px 1fr; gap: 12px; border-bottom: 1px solid #efefef; }
.tp .a { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; }
.tp .who { font-size: 15px; font-weight: 600; } .tp .who span { color: #999; font-weight: 400; margin-left: 6px; }
.tp .txt { font-size: 15px; line-height: 1.42; margin-top: 2px; }
.tp .txt a { color: #0a58ca; text-decoration: none; }
.tp .vid { margin-top: 10px; height: 280px; border-radius: 10px; font-size: 13px; border: 1px solid #e5e5e5; }
.tp .acts { display: flex; gap: 22px; margin-top: 12px; color: #424242; font-size: 13.5px; }
.tp .acts span { display: flex; align-items: center; gap: 6px; }
.tp.small .vid { height: 120px; }
.tp.fresh { background: rgba(22,121,76,.035); }
.mirrors { position: absolute; right: 20px; top: 20px; display: flex; flex-direction: column; gap: 8px; width: 230px; }
.mir { padding: 10px 12px; font-size: 13px; display: flex; gap: 10px; align-items: center; background: #fff; border: 1px solid #e5e5e5; border-radius: 10px; font-family: "Funnel Sans"; box-shadow: var(--shadow-lift); }
.mir .lg { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; font-weight: 800; font-size: 12px; flex: none; }
.mir em { margin-left: auto; color: var(--accent); font-style: normal; font-weight: 700; }

/* ---------- slide: learning ---------- */
.cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
.pcard { padding: 16px; position: relative; overflow: hidden; }
.pcard.win { border-color: rgba(42,120,214,.4); }
.pcard.flop { border-color: rgba(217,83,74,.4); }
.pcard .top { display: grid; grid-template-columns: 150px 1fr; gap: 14px; }
.pcard .scene { height: 92px; font-size: 6px; }
.pcard .tag { font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
.pcard.win .tag { color: var(--pos); } .pcard.flop .tag { color: var(--neg); }
.pcard b.t { display: block; font-size: 14px; line-height: 1.3; margin: 4px 0 6px; }
.pcard .nums { display: flex; align-items: baseline; gap: 10px; margin-top: 6px; }
.pcard .nums strong { font-family: "Funnel Display"; font-size: 30px; font-weight: 700; }
.pcard .nums span { font-size: 13px; font-weight: 700; padding: 2px 8px; border-radius: 6px; color: var(--muted); }
.pcard.win .nums span.x { color: var(--pos); background: rgba(42,120,214,.1); }
.pcard.flop .nums span.x { color: var(--neg); background: rgba(217,83,74,.1); }
.taught { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--border-strong); }
.taught .lbl { margin-bottom: 8px; }
.taught .chips { display: flex; gap: 6px; flex-wrap: wrap; min-height: 26px; }
.lg-grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 16px; margin-top: 16px; }
.panel { padding: 16px 18px; }
.panel h3 { font-size: 15px; display: flex; justify-content: space-between; align-items: center; }
.panel h3 small { font-weight: 500; color: var(--muted); font-size: 12px; }
.ptag { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.trait { display: grid; grid-template-columns: 130px 1fr 80px; gap: 10px; align-items: center; margin-top: 11px; font-size: 13px; }
.trait .nm { color: var(--text-dim); }
.dv { position: relative; height: 18px; }
.dv::before { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--border-strong); }
.dv i { position: absolute; top: 2px; height: 14px; transition: width 1.1s var(--ease); }
.dv i.p { left: calc(50% + 1px); background: var(--pos); border-radius: 0 4px 4px 0; }
.dv i.n { right: calc(50% + 1px); background: var(--neg); border-radius: 4px 0 0 4px; }
.dv .v { position: absolute; top: 0; font-size: 12px; color: var(--text); font-weight: 700; transition: left 1.1s var(--ease), right 1.1s var(--ease); white-space: nowrap; }
.dv .v.bump { animation: bump .7s var(--ease); }
@keyframes bump { 30% { transform: scale(1.25); } }
.vst { font-size: 11px; font-weight: 700; text-align: right; }
.vst.act { color: var(--accent); } .vst.prov { color: var(--warn); }
.vst small { display: block; font-weight: 500; color: var(--muted); }
.rerank { margin-top: 12px; font-size: 13px; color: var(--text-dim); display: flex; gap: 8px; align-items: center; padding: 9px 12px; border-radius: 10px; background: var(--accent-soft); border: 1px solid var(--accent-border); }
.rerank svg { color: var(--accent); flex: none; }
.log { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.le { display: grid; grid-template-columns: 26px 1fr; gap: 10px; font-size: 13px; line-height: 1.4; padding: 9px 10px; border-radius: 10px; background: var(--bg-raised); border: 1px solid var(--border); }
.le .ico { width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; font-size: 12px; font-weight: 800; }
.le b { color: var(--text); font-weight: 600; } .le span { color: var(--text-dim); } .le small { display: block; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>

<script>

const I = {

function rail(active) {
  const items = [['create', I.create], ['lib', I.lib], ['cal', I.cal], ['bell', I.bell], ['chart', I.chart]];
  return `<nav class="rail"><div class="logo">${I.leaf}</div>${items.map(([k, s]) => `<div class="ic ${k === active ? 'on' : ''}">${s}</div>`).join('')}
    <div class="sp"></div><div class="ic ${active === 'cog' ? 'on' : ''}">${I.cog}</div></nav>`;

const shell = (active, inner) => `<div class="app">${rail(active)}<main class="main">${inner}</main></div>`;

const SVG = {

    <path d="M0 60 Q40 52 80 62 T160 58 V90 H0z" fill="#120806"/></svg>`,

    <rect y="72" width="160" height="18" fill="#1d2329"/></svg>`,

/* =========================================================
   Animation engine: one run at a time, cancelled on slide change
   ========================================================= */
let scale = 1, runId = 0;
const CANCEL = Symbol('cancel');
const stage = document.getElementById('stage'), vp = document.getElementById('vp'), content = document.getElementById('content');
const cursor = document.getElementById('cursor');
let cx = 900, cy = 700;

function fit() { scale = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.transform = `translate(-50%,-50%) scale(${scale})`; }
addEventListener('resize', fit); fit();

function mk(id) {
  const live = () => { if (id !== runId) throw CANCEL; };
  const $ = s => typeof s === 'string' ? content.querySelector(s) : s;
  const wait = ms => new Promise(r => setTimeout(r, ms)).then(live);
  const pos = (el, fx = .5, fy = .5) => {
    const r = $(el).getBoundingClientRect(), v = vp.getBoundingClientRect();
    return [(r.left - v.left + r.width * fx) / scale, (r.top - v.top + r.height * fy) / scale];
  };
  const a = {
    $, wait,
    show() { cursor.style.opacity = 1; },
    async move(el, { fx = .5, fy = .5, dur } = {}) {
      live(); a.show();
      const [x, y] = pos(el, fx, fy);
      const d = dur ?? Math.min(1100, Math.max(420, Math.hypot(x - cx, y - cy) * 1.1));
      cursor.style.transitionDuration = d + 'ms';
      cursor.style.transform = `translate(${x - 4}px, ${y - 3}px)`;
      cx = x; cy = y;
      await wait(d + 60);
    },
    async click(el, opts) {
      if (el) await a.move(el, opts);
      live();
      cursor.classList.add('down');
      const t = el && $(el); if (t) t.classList.add('pressed');
      const r = document.createElement('div'); r.className = 'ripple'; r.style.left = cx + 'px'; r.style.top = cy + 'px'; vp.appendChild(r);
      setTimeout(() => r.remove(), 600);
      await wait(130);
      cursor.classList.remove('down'); if (t) t.classList.remove('pressed');
      await wait(160);
    },
    async type(el, text, speed = 32) {
      const box = $(el), v = box.querySelector('.v') || box;
      const ph = box.querySelector('.ph'); if (ph) ph.remove();
      const caret = document.createElement('span'); caret.className = 'caret'; v.after(caret);
      for (const ch of text) { v.textContent += ch; await wait(speed + (ch === ' ' ? 30 : 0) + Math.random() * 18); }
      await wait(200); caret.remove();
    },
    async stream(el, text, speed = 14) {
      const v = $(el); const caret = document.createElement('span'); caret.className = 'caret'; v.after(caret);
      for (const w of text.split(/(\s+)/)) { v.textContent += w; await wait(speed * Math.max(1, w.length) * .55 + 20); }
      caret.remove();
    },
    async count(el, to, dur = 1500, fmt = n => Math.round(n).toLocaleString(), from = 0) {
      const e = $(el), t0 = performance.now();
      while (true) { live(); const p = Math.min(1, (performance.now() - t0) / dur); e.textContent = fmt(from + (to - from) * (1 - Math.pow(1 - p, 3))); if (p >= 1) break; await wait(16); }
    },
    add(el, c) { $(el).classList.add(...c.split(' ')); }, rm(el, c) { $(el).classList.remove(...c.split(' ')); },
    html(el, h) { $(el).innerHTML = h; },
    async pop(parent, html, gap = 30) {
      $(parent).insertAdjacentHTML('beforeend', html);
      const el = $(parent).lastElementChild; await wait(gap); el.classList.add('in'); return el;
    },
  };
  return a;
}

/* =========================================================
   Navigation
   ========================================================= */
let cur = -1;
const $id = id => document.getElementById(id);
const dots = $id('dots');
dots.innerHTML = slides.map((_, i) => `<i data-i="${i}"></i>`).join('');
dots.addEventListener('click', e => { if (e.target.dataset.i) go(+e.target.dataset.i); });

async function go(i, replay = false) {
  i = Math.max(0, Math.min(slides.length - 1, i));
  if (i === cur && !replay) return;
  const s = slides[i], id = ++runId, wasTitle = cur <= 0;
  cur = i;
  [...dots.children].forEach((d, k) => { d.className = k === i ? 'on' : k < i ? 'done' : ''; });
  history.replaceState(null, '', '#' + (i + 1));
  cursor.style.opacity = 0;
  stage.classList.toggle('is-title', !!s.title);
  if (s.title) return;

  $id('copy').classList.add('out'); content.classList.add('out');
  await new Promise(r => setTimeout(r, wasTitle ? 150 : 350));
  if (id !== runId) return;
  $id('kicker').textContent = String(i).padStart(2, '0') + ' · ' + s.kicker;
  $id('headline').textContent = s.head; $id('sub').textContent = s.sub; $id('url').textContent = s.url;
  vp.querySelectorAll('.flyer,.why,.ripple').forEach(e => e.remove());
  content.innerHTML = s.html();
  cx = 900; cy = 760; cursor.style.transitionDuration = '0ms'; cursor.style.transform = `translate(${cx}px,${cy}px)`;
  $id('copy').classList.remove('out'); content.classList.remove('out');
  try { await s.run(mk(id)); } catch (e) { if (e !== CANCEL) console.error(e); }
  if (id === runId) setTimeout(() => { if (id === runId) cursor.style.opacity = 0; }, 1400);
}

addEventListener('keydown', e => {
  const k = e.key;
  if (['ArrowRight', ' ', 'PageDown', 'Enter'].includes(k)) { e.preventDefault(); go(cur + 1); }
  else if (['ArrowLeft', 'PageUp', 'Backspace'].includes(k)) { e.preventDefault(); go(cur - 1); }
  else if (k === 'r' || k === 'R') go(cur, true);
  else if (k === 'f' || k === 'F') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
  else if (k === 'Home') go(0); else if (k === 'End') go(slides.length - 1);
  else if (/^[0-9]$/.test(k)) go(+k);
});
stage.addEventListener('click', e => { if (!e.target.closest('#dots')) go(cur + 1); });
setTimeout(() => $id('hint').style.opacity = 0, 5000);
go(Math.max(0, (parseInt(location.hash.slice(1)) || 1) - 1));
</script>
</body>
