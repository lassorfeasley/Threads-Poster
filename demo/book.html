<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book a meeting · Continuity Marketing</title>
<meta name="description" content="Get early access to Throughline. Book a meeting with Continuity Marketing.">
<meta name="theme-color" content="#f5f2ea">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300..800;1,400&display=swap">
<style>
:root { --paper: #f5f2ea; --card: #fffdf8; --ink: #161512; --ink-2: #3d3a33; --muted: #77715f; --line: #ddd6c5; --accent: #1d5c43;
  --serif: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; --sans: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--sans); font-size: 15px; line-height: 1.65; color: var(--ink); background: var(--paper); -webkit-text-size-adjust: 100%; }
a { color: inherit; }
.wrap { width: min(1120px, calc(100% - 40px)); margin: 0 auto; }
nav .wrap { display: flex; align-items: center; justify-content: space-between; height: 72px; }
.wordmark { font-family: var(--serif); font-size: 16px; font-weight: 800; letter-spacing: -.03em; text-decoration: none; }
.wordmark em { font-style: normal; font-weight: 400; }
nav a.signin { font-size: 15px; color: var(--ink-2); text-decoration: none; }
main { padding: 48px 0 96px; }
h1 { font-family: var(--serif); font-weight: 800; line-height: 1.08; letter-spacing: -.04em; font-size: clamp(28px, 4.6vw, 40px); }
h1 em { font-style: normal; color: var(--accent); }
.cal { margin-top: 32px; background: #fff; border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
.cal iframe { display: block; width: 100%; height: 760px; border: 0; }
.fallback { margin-top: 14px; font-size: 14px; color: var(--muted); }
footer { padding: 32px 0 48px; border-top: 1px solid var(--line); font-size: 14px; color: var(--muted); }
footer .wrap { display: flex; flex-wrap: wrap; gap: 12px 28px; justify-content: space-between; }
</style>
</head>
<body>

<nav>
  <div class="wrap">
    <a class="wordmark" href="/">Continuity <em>Marketing</em></a>
    <a class="signin" href="/signin">Sign in</a>
  </div>
</nav>

<main>
  <div class="wrap">
    <h1>Get early access. <em>Book a meeting.</em></h1>
    <div class="cal">
      <iframe src="https://calendar.google.com/calendar/appointments/schedules/AcZssZ26whY5LNM8JXlEMBDXfcak6PINl_sZrO9qmI9UMJsbrl32zkYpl72IgJjg3hchPfWL8p36h1tW?gv=true"
              title="Book a meeting with Continuity Marketing"></iframe>
    </div>
    <p class="fallback">Calendar not loading? <a href="https://calendar.app.google/c5d3in4NN5B2iCu57" target="_blank" rel="noopener">Open it in a new tab.</a></p>
  </div>
</main>

<footer>
  <div class="wrap">
    <span>Continuity Throughline is made by Continuity Marketing.</span>
    <span><a href="/privacy">Privacy</a> &nbsp;·&nbsp; <a href="/terms">Terms</a> &nbsp;·&nbsp; © 2026 Continuity Marketing</span>
  </div>
</footer>

</body>
</html>
