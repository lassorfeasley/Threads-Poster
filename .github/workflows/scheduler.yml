name: Threads scheduler

# Runs one adaptive-scheduler tick (windows + metrics) PER WORKSPACE so queued
# posts publish even when the operator's machine is off. The tick is
# idempotent: SchedulerState in each workspace's Postgres tracks processed
# windows, and the publish claim is atomic, so overlapping with a locally
# running dashboard scheduler (or the Fly worker) is safe.
#
# Secrets convention: the climate workspace uses the original unsuffixed
# secrets; every other workspace suffixes them with its slug
# (DATABASE_URL_PILATES, ...). A workspace whose database secret is missing is
# skipped, so a new workspace can be merged before its infrastructure exists.
#
# Schedule notes:
# - GitHub cron is UTC only; posting windows are ET (see scheduler.windows in
#   each workspace's settings.yaml). The hour range below covers active hours
#   (08:00-22:00 ET) in both EDT (UTC-4) and EST (UTC-5). Off-hours ticks exit
#   in seconds.
# - GitHub may delay scheduled runs by 5-15 minutes; the window logic
#   catches up on the next tick, so drift only shifts a post slightly.
on:
  schedule:
    - cron: "*/30 12-23,0-3 * * *"
  workflow_dispatch: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: threads-scheduler-${{ matrix.workspace }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - workspace: climate
            suffix: ""
          - workspace: pilates
            suffix: "_PILATES"
    env:
      WORKSPACE: ${{ matrix.workspace }}
      DATABASE_URL: ${{ secrets[format('DATABASE_URL{0}', matrix.suffix)] }}
      SUPABASE_URL: ${{ secrets[format('SUPABASE_URL{0}', matrix.suffix)] }}
      SUPABASE_SERVICE_KEY: ${{ secrets[format('SUPABASE_SERVICE_KEY{0}', matrix.suffix)] }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        if: env.DATABASE_URL != ''
      - uses: actions/setup-python@v5
        if: env.DATABASE_URL != ''
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-scheduler.txt
      - run: pip install -r requirements-scheduler.txt
        if: env.DATABASE_URL != ''
      - name: Run one scheduler tick
        if: env.DATABASE_URL != ''
        run: python run.py scheduler --workspace "$WORKSPACE"
