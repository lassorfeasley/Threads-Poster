<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sign in · {{ brand_name() }}</title>
<script>
  try { document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark'); }
  catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/static/style.css?v={{ static_v }}">
<style>
  body.login { min-height: 100vh; display: grid; place-items: center; margin: 0; background: var(--bg); }
  .login-card { width: min(380px, calc(100vw - 40px)); padding: 32px; border-radius: 16px;
    background: var(--panel); border: 1px solid var(--border); }
  .login-card h1 { margin: 0 0 4px; font-size: 22px; color: var(--text); }
  .login-card p.sub { margin: 0 0 24px; color: var(--muted); font-size: 14px; }
  .login-card label { display: block; font-size: 13px; color: var(--text-dim); margin: 14px 0 6px; }
  .login-card input { width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--border-strong); background: var(--panel2); color: var(--text); font: inherit; }
  .login-card button { width: 100%; margin-top: 22px; padding: 11px; border: 0; border-radius: 10px;
    background: var(--accent); color: #0b1f15; font: inherit; font-weight: 700; cursor: pointer; }
  .login-err { margin: 0 0 8px; padding: 10px 12px; border-radius: 10px; font-size: 14px;
    background: rgba(220, 80, 60, .12); color: #e57a63; }
</style>
</head>
<body class="login">
<form class="login-card" method="post" action="/login">
  <h1>{{ brand_name() }}</h1>
  <p class="sub">Sign in to your dashboard.</p>
  {% if error == "invalid" %}<p class="login-err">That email and password don't match.</p>
  {% elif error == "throttled" %}<p class="login-err">Too many attempts. Try again in 15 minutes.</p>{% endif %}
  <input type="hidden" name="next" value="{{ next }}">
  <label for="email">Email</label>
  <input id="email" name="email" type="email" autocomplete="username" required autofocus>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <button type="submit">Sign in</button>
</form>
</body>
</html>
