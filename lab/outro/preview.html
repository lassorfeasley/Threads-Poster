<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Outro lab · Renewables.org</title>
<style>
  :root { --bg: #0d1117; --panel: #161b22; --line: #30363d; --text: #e6edf3; --muted: #8b949e; --accent: #3ecf8e; --brand: #1A4A7D; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Inter", sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 14px 22px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 5; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--brand); box-shadow: 0 0 0 3px #1a4a7d55; }
  #status { color: var(--muted); font-size: 12px; margin-left: auto; }
  #status.err { color: #ff7b72; }
  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 12px 22px; border-bottom: 1px solid var(--line); }
  button, select { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 7px; padding: 6px 11px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button.primary { background: var(--brand); border-color: #2c6db0; }
  label { color: var(--muted); display: flex; gap: 6px; align-items: center; user-select: none; }
  #error { display: none; margin: 14px 22px 0; padding: 10px 14px; border: 1px solid #ff7b7266; background: #ff7b7214; color: #ffb3ad; border-radius: 8px; white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 12px; }
  main { display: flex; gap: 28px; padding: 22px; align-items: flex-start; flex-wrap: wrap; }
  .sample { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .sample h2 { font-size: 13px; margin: 0 0 4px; font-weight: 600; }
  .meta { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
  .stage { position: relative; background: #000; border-radius: 8px; overflow: hidden; }
  .stage video { display: block; width: 100%; height: 100%; }
  .vertical .stage { height: min(72vh, 760px); aspect-ratio: 9 / 16; }
  .landscape .stage { width: min(58vw, 860px); aspect-ratio: 16 / 9; }
  .safe { position: absolute; inset: 0; pointer-events: none; display: none; }
  body.show-safe .safe { display: block; }
  .safe .band { position: absolute; left: 0; right: 0; background: #ff3b3044; border-color: #ff3b30aa; }
  .safe .side { position: absolute; top: 0; bottom: 0; background: #ff3b3030; }
  .safe .tag { position: absolute; font-size: 10px; color: #ffd0cc; padding: 2px 5px; }
  .bar { position: relative; height: 6px; background: #21262d; border-radius: 3px; margin-top: 10px; cursor: pointer; }
  .bar .outro { position: absolute; top: 0; bottom: 0; background: var(--brand); border-radius: 0 3px 3px 0; }
  .bar .fade { position: absolute; top: 0; bottom: 0; background: linear-gradient(90deg, transparent, var(--brand)); }
  .bar .head { position: absolute; top: -3px; width: 2px; height: 12px; background: #fff; }
  .sheet { display: block; margin-top: 12px; max-width: 100%; border-radius: 6px; }
  .card-link { color: var(--muted); font-size: 12px; }
  details { margin: 0 22px 30px; }
  summary { color: var(--muted); cursor: pointer; }
  pre { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; overflow: auto; font-size: 12px; }
  kbd { border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; font-size: 11px; }
</style>
</head>
<body>
<header>
  <span class="dot"></span>
  <h1>Post-roll outro lab</h1>
  <span id="status">waiting for render…</span>
</header>

<div class="controls">
  <button class="primary" id="replay">▶ Replay from lead-in <kbd>space</kbd></button>
  <button id="jump">Jump to dissolve <kbd>d</kbd></button>
  <button id="pause">Pause <kbd>p</kbd></button>
  <select id="speed">
    <option value="1">1×</option>
    <option value="0.5">0.5×</option>
    <option value="0.25">0.25×</option>
  </select>
  <label><input type="checkbox" id="loop" checked> Loop</label>
  <label><input type="checkbox" id="muted" checked> Muted</label>
  <label><input type="checkbox" id="safe"> Reels safe zones</label>
  <label><input type="checkbox" id="autoplay" checked> Auto-play on re-render</label>
</div>

<div id="error"></div>
<main id="samples"></main>
<details>
  <summary>outro.yaml used for this render</summary>
  <pre id="config"></pre>
</details>

<script>
const $ = (s) => document.querySelector(s);
let version = null;
let manifest = null;

function videos() { return [...document.querySelectorAll("video")]; }

function playAll(fromDissolve) {
  videos().forEach((v) => {
    const s = JSON.parse(v.dataset.sample);
    v.currentTime = fromDissolve ? Math.max(0, s.outro_start - 0.3) : 0;
    v.playbackRate = Number($("#speed").value);
    v.play().catch(() => {});
  });
}

function safeOverlay(s) {
  if (s.orientation !== "vertical") return "";
  // 4:5 feed crop keeps y 285..1635; Reels UI covers the bottom 350px; full-screen crops ~100px per side.
  const pct = (px) => (px / s.h * 100).toFixed(2) + "%";
  const side = (100 / s.w * 100).toFixed(2) + "%";
  return `<div class="safe">
    <div class="band" style="top:0;height:${pct(285)}"><span class="tag">4:5 feed crop</span></div>
    <div class="band" style="top:${pct(1635)};bottom:0"></div>
    <div class="band" style="top:${pct(s.h - 350)};bottom:0;background:#ff9f0a33"><span class="tag" style="bottom:0">Reels UI</span></div>
    <div class="side" style="left:0;width:${side}"></div>
    <div class="side" style="right:0;width:${side}"></div>
  </div>`;
}

function render(m) {
  const main = $("#samples");
  main.innerHTML = "";
  m.samples.forEach((s) => {
    const el = document.createElement("section");
    el.className = `sample ${s.orientation}`;
    const pctStart = (s.outro_start / s.total) * 100;
    const pctFade = (s.dissolve / s.total) * 100;
    el.innerHTML = `
      <h2>${s.name}</h2>
      <div class="meta">${s.w}×${s.h} · card ${s.duration}s (dissolve ${s.dissolve}s) · adds ${s.added_seconds}s to the clip</div>
      <div class="stage">
        <video playsinline preload="auto" src="${s.video}?v=${m.version}"></video>
        ${safeOverlay(s)}
      </div>
      <div class="bar">
        <div class="outro" style="left:${pctStart}%;right:0"></div>
        <div class="fade" style="left:${pctStart}%;width:${pctFade}%"></div>
        <div class="head"></div>
      </div>
      <img class="sheet" src="${s.sheet}?v=${m.version}" alt="contact sheet">
      <a class="card-link" href="${s.card}?v=${m.version}" target="_blank">Open full-res final frame ↗</a>`;
    const v = el.querySelector("video");
    v.dataset.sample = JSON.stringify(s);
    v.muted = $("#muted").checked;
    const head = el.querySelector(".head");
    v.addEventListener("timeupdate", () => { head.style.left = (v.currentTime / s.total * 100) + "%"; });
    v.addEventListener("ended", () => { if ($("#loop").checked) { v.currentTime = 0; v.play(); } });
    el.querySelector(".bar").addEventListener("click", (e) => {
      const r = e.currentTarget.getBoundingClientRect();
      v.currentTime = (e.clientX - r.left) / r.width * s.total;
    });
    main.appendChild(el);
  });
  $("#config").textContent = m.config || "";
}

async function poll() {
  try {
    const res = await fetch("out/manifest.json", { cache: "no-store" });
    const m = await res.json();
    if (m.version !== version) {
      const first = version === null;
      version = m.version;
      manifest = m;
      const err = $("#error");
      err.style.display = m.error ? "block" : "none";
      err.textContent = m.error ? "Render failed; showing the last good render.\n\n" + m.error : "";
      if (!m.error || first) render(m);
      if (!m.error && (first || $("#autoplay").checked)) setTimeout(() => playAll(false), 150);
      const st = $("#status");
      st.className = m.error ? "err" : "";
      st.textContent = `${m.error ? "error" : "rendered"} ${new Date(m.version * 1000).toLocaleTimeString()} · ${m.render_seconds}s`;
    }
  } catch (e) {
    $("#status").textContent = "render server not reachable";
    $("#status").className = "err";
  }
  setTimeout(poll, 800);
}

$("#replay").onclick = () => playAll(false);
$("#jump").onclick = () => playAll(true);
$("#pause").onclick = () => videos().forEach((v) => v.paused ? v.play() : v.pause());
$("#speed").onchange = () => videos().forEach((v) => (v.playbackRate = Number($("#speed").value)));
$("#muted").onchange = () => videos().forEach((v) => (v.muted = $("#muted").checked));
$("#safe").onchange = () => document.body.classList.toggle("show-safe", $("#safe").checked);
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  if (e.key === " ") { e.preventDefault(); playAll(false); }
  if (e.key === "d") playAll(true);
  if (e.key === "p") $("#pause").click();
});
poll();
</script>
</body>
</html>
