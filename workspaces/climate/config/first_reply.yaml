# Auto first-reply posted under every Threads post this app publishes.
# Editable via the cog on the Replies page; no code changes needed.
#
# mode decides what the "Suggest a draft" button writes into the first-reply box
# on the cut and post pages:
#   citation   - a formal credit line for the source publisher (drafted only
#                when you click Suggest; nothing is written automatically).
#   invitation - a call to action written from `instruction` below, drafted
#                automatically for every post so none goes out without one.
# Either way the drafted text lands in an editable box you review before the
# post publishes; the first comment is only ever the text sitting in that box.
#
# instruction is your own plain-language brief for invitation mode, passed to
# the model as the authoritative spec. It is also the ONLY source of factual
# claims the model may make, so any statistic or figure you want used has to
# appear here verbatim.
#
# attribution_enabled: when false, the first comment never posts, whatever is in
# the box. When enabled is true and text is non-empty, that static text is the
# fallback for posts whose box is empty. A reply failure never rolls back the
# post — check the post page and retry there.
#
# first_party_enabled: whether the brand's OWN promos get a first comment at all.
# On those the clip IS the ad, so the call to action belongs in the caption where
# it lands with the post, not in a comment the timing gates below can hold back
# for hours — long enough for a viewer to ask where to go and get no answer. Set
# it false and promo captions have to carry the URL themselves; found footage is
# unaffected either way.
#
# WHEN the first comment posts. By default it goes out seconds after the post,
# which makes it the first thing under every clip — and a promotional comment
# sitting in that slot can smother the audience replies that would otherwise
# start the conversation. These four hold it back until the post has a
# conversation of its own:
#   delay_minutes  - don't comment until the post is at least this old
#   min_replies    - ...and until this many OTHER people have replied
#   min_likes      - ...and until it has at least this many likes
#   deadline_hours - comment anyway once the post is this old, so a post that
#                    never got replies still gets its call to action
#                    (0 = wait indefinitely)
# All four at 0 restores the original behavior: comment immediately on publish.
#
# The deadline fires only on posts that FLOPPED — a post that got its replies
# was commented under long before. Left unqualified it therefore attaches the
# pitch to your weakest posts and only your weakest posts, which is backwards:
# nobody is reading the comments on a post nobody engaged with, so the ask earns
# nothing, while a Threads post that revives days later shows new arrivals a
# pitch before anyone has had a chance to reply. These two put a floor under it:
#   deadline_min_views - at the deadline, comment only if the post cleared this
#   deadline_min_likes - ...or this (either one is enough)
# A post under both is skipped for good rather than commented on. Both at 0
# means no floor: the deadline comments on everything it reaches.

mode: invitation
enabled: true
attribution_enabled: true
first_party_enabled: false
delay_minutes: 120
min_replies: 1
min_likes: 0
deadline_hours: 12
deadline_min_views: 500
deadline_min_likes: 50
instruction: |
  Write a short, plain note pointing readers to Renewables.org, one or two
  sentences.

  It should read like the poster adding a useful aside under their own clip,
  not like an ad. No questions, no exclamation marks, no urgency, and never
  describe the reader's feelings. A light, natural bridge from the clip is fine
  ("If you want to do something about this, ..." or "One practical thing you
  can do: ...") but it's equally fine to skip it and just state the ask. Don't
  use the same bridge twice in a row.

  It must contain the URL Renewables.org written exactly that way, with no
  https:// and no tracking parameters. Say that Renewables.org is a nonprofit
  and that the money finances solar projects in the Global South. Vary how you
  phrase this every time — different verbs, different sentence shape, different
  emphasis — so the same line never appears twice.

  You may also use any of the following facts, but only word them in ways that
  stay true to them. Rotate which one you include rather than using all of them:
    - Anyone can invest as little as $25.
    - Investors are paid back as the panels generate and sell clean electricity
      to the grid.
    - You don't earn an interest rate, but dollar-for-dollar you create 550% more
      carbon avoidance than investing in the Global North would.

  Never promise a financial return. Always call it an investment: never a
  donation, contribution, gift, or pledge, and never use the verb "donate" or
  "give". Never state any number that does not appear above.
text: Nonprofit Renewables.org allows anyone to invest as little as $25 in Global South
  solar and get paid back as they generate and sell clean electricity to the grid. You
  don't earn an interest rate, but dollar-for-dollar, you'll create 550% more carbon
  avoidance than you would have investing in the Global North.
