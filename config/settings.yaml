# Main application settings. Everything here is operator-editable.

monitor:
  # How often `run.py monitor --loop` polls channels, in minutes. The GitHub
  # Actions monitor workflow has its own 6-hour cron (see
  # .github/workflows/monitor.yml); this value only drives local loop mode.
  poll_interval_minutes: 360
  # Default monitor window by publish date: number of calendar days to scan,
  # counting today (2 = today + yesterday). Also the dashboard's default date
  # filter. Override a single run with the "look back" box on the dashboard.
  default_lookback_days: 2
  # Max uploads fetched per channel per poll (safety cap; local news volume is low).
  max_results_per_channel: 25
  # Skip portrait/vertical videos (YouTube Shorts) — they don't fit the clip workflow.
  exclude_portrait: true

matching:
  # LLM relevance score is 0.0-1.0. Candidates below this are hidden by default
  # in the review dashboard (still stored, still viewable with "show hidden").
  score_threshold: 0.5
  # LLM model used for relevance scoring (Anthropic model ID).
  model: claude-haiku-4-5

categories:
  # Programming categories for the channel mix. Every video gets exactly ONE
  # category; the goal is a roughly equal distribution of the three across
  # what gets posted. The LLM auto-tags a recommended category for each new
  # candidate (operator can override on the video page). All videos are
  # climate-related — the category captures the genre/framing of the footage.
  model: claude-haiku-4-5
  # Tag new candidates during the monitor pass (alongside relevance scoring).
  tag_at_monitor: true
  options:
    - slug: news
      emoji: "📰"
      label: News, views & politics
      description: >-
        Breaking news, cable news clips, press conferences, political coverage,
        current-events reporting and commentary.
    - slug: nature
      emoji: "🌿"
      label: Conservation, nature & exploration
      description: >-
        Nature documentaries, wildlife and conservation stories, travelogues,
        exploration and educational science content.
    - slug: culture
      emoji: "📼"
      label: Pop culture, history & media
      description: >-
        Throwback clips, archival footage, history segments, climate in fiction,
        television, film and other media moments.

vision:
  # Optionally tag candidates from YouTube storyboard stills (metadata-only —
  # nothing downloaded). Neutral labels only; no visual "punch" score. Ranking
  # uses climate relevance (+ ACTIVE learned trait verdicts once unlocked).
  # Ground-truth learning tags come from the published clip file, not this.
  enabled: true
  model: claude-haiku-4-5
  # Tag during the monitor pass so triage can show trait badges early.
  # Only candidates at/above min_relevance are tagged.
  score_at_monitor: true
  min_relevance: 0.5
  max_per_run: 40
  max_sheets: 4
  # Flat trait vocabulary (seeded into the Traits page on first run; page edits
  # take precedence). Observation only — performance decides good/bad later.
  traits:
    - action
    - people_doing_things
    - fire
    - flood
    - storm_damage
    - destruction
    - rescue_or_emergency_response
    - crowd
    - dramatic_weather
    - aerial_or_sweeping_shot
    - talking_head_or_anchor_at_desk
    - static_graphic_or_slideshow
    - chart_or_data_screen
    - text_heavy_lower_thirds
    - press_conference_podium
    - low_motion_studio_segment
  # Frames extracted from each PUBLISHED clip for ground-truth trait annotation.
  post_frames: 12

ranking:
  # Queue order: climate relevance, optionally nudged by ACTIVE trait verdicts
  # (see `learning:`). Visual scores are retired.
  relevance_weight: 1.0
  # How far an ACTIVE trait verdict can move a candidate's score (0 = ignore).
  trait_influence: 0.3

learning:
  # The trait self-improvement loop. Traits are annotated on every published
  # post unconditionally (collect-first), but verdicts only start influencing
  # ranking once BOTH gates are met — so a few lucky posts can't steer the tool.
  # Gate 1: total published posts with metrics before ANY verdict activates
  # (the account baseline needs this much data to be meaningful).
  min_total_posts: 100
  # Gate 2: times a specific trait must be observed before its verdict activates.
  min_trait_posts: 20
  # Traits at >= this fraction of the per-trait gate show as "provisional" on
  # the Traits page (display only, still no influence).
  provisional_fraction: 0.5
  # Compare every post's performance at the same age (hours after publish),
  # interpolated from metric snapshots — otherwise old posts always "win".
  metric_age_hours: 48
  # Recency decay half-life for the rolling baseline and per-trait medians, so
  # verdicts drift with the audience instead of fossilizing early conclusions.
  halflife_days: 90

voice:
  # Match caption suggestions to the operator's own writing voice: past
  # captions (hand-written and operator-edited ones weighted highest) are fed
  # to the drafting model as few-shot examples plus a distilled style guide.
  enabled: true
  # Captions needed before voice matching kicks in (below this, generic style).
  min_captions: 3
  # How many example captions to include with each suggestion request.
  examples: 8
  # Example hooks shown when drafting an Instagram Reel hook. Sourced only from
  # hooks the operator rewrote (there is no published hook history to learn
  # from — the hook is burned into the video, never posted as text).
  hook_examples: 6
  # Most of the example slots that captions imported from Threads history may
  # occupy. Imported posts are hand-written (so they score highest on voice)
  # AND the oldest material there is — uncapped they took every slot, and the
  # drafter never saw a caption written in the app. The rest of the slots go to
  # the operator's recent captions, which carry the current style.
  history_example_share: 0.5
  # Rebuild the cached style guide after this many new published captions.
  refresh_every: 5
  # Model used to distill the style guide (cheap; runs rarely).
  model: claude-sonnet-5
  # Learn the caption LENGTH the operator actually posts and give the drafter
  # that as its target. This is what keeps drafts short without hand-tuning a
  # limit: as the operator's own captions get shorter, so does the target.
  learn_length: true
  # Recent operator-written captions the target is the median of.
  length_sample: 8
  # Below this many, fall back to the generic length instruction (too few
  # captions to infer a preference from).
  length_min_sample: 4
  # Once there are `length_min_sample` captions written in the app, learn
  # length from those alone and ignore imported Threads history. History is
  # hand-written but predates the current strategy and runs much longer, so
  # leaving it in holds the target high for a dozen posts.
  length_prefer_app_captions: true
  # Clamps, so one outlier caption can't drive the target somewhere absurd.
  length_min_words: 3
  length_max_words: 40

llm:
  # Budget guardrail. Total Anthropic spend per day (UTC) is tracked in
  # data/llm_spend.json; vision scoring stops for the day once this is hit
  # (relevance scoring and the digest are cheap and always run).
  daily_budget_usd: 3.0
  # Approximate prices in USD per 1,000,000 tokens, used only to estimate spend
  # for the budget guardrail. Update if Anthropic's pricing changes.
  pricing:
    claude-haiku-4-5:
      input: 1.0
      output: 5.0
    claude-sonnet-5:
      input: 3.0
      output: 15.0
    default:
      input: 3.0
      output: 15.0

storage:
  # Local disk root for full downloaded segments, organized channel/date under it.
  download_dir: data/videos
  # Where transcripts are written (also stored in the DB).
  transcript_dir: data/transcripts
  # Retention for full segments: "keep" (default, never delete) or an integer
  # number of days after which the CLEANUP COMMAND (never automatic) may prune.
  retention: keep
  # Optional redundancy: also copy full segments to a PRIVATE Supabase bucket.
  # Off by default by design (keep raw segments local).
  backup_full_segments_to_cloud: false
  # Supabase Storage bucket for trimmed clips (public URL needed by Threads).
  trimmed_clip_bucket: trimmed-clips
  # Seconds a signed clip URL stays valid; must outlive Meta's fetch+processing
  # window. 1 hour is comfortable.
  signed_url_ttl_seconds: 3600
  # Max clip size (MB) to upload to Supabase. Clips larger than this are
  # recompressed to fit before upload — Supabase rejects oversized uploads with
  # a 413 that otherwise fails the publish. Keep a margin under your project's
  # per-file limit (50MB on the free plan). Set 0 to disable recompression.
  max_upload_mb: 45

scrape:
  # Politeness delays between any two yt-dlp operations (seconds, randomized range).
  delay_min_seconds: 8
  delay_max_seconds: 25
  # yt-dlp format selection for the full segment.
  ytdlp_format: "bv*[height<=1080]+ba/b[height<=1080]"

threads:
  # Threads user id is discovered automatically after OAuth; leave blank.
  user_id: ""
  # How long to wait for Meta to finish processing an uploaded video before
  # giving up (seconds). Larger clips take longer; bump this if posts time out.
  publish_poll_timeout_seconds: 600
  # How often to poll the media container's processing status (seconds).
  publish_poll_interval_seconds: 10
  # A first-comment container carries no video, but Meta still has to register
  # it before it can be published — publishing immediately loses replies to
  # "the requested resource does not exist". Shorter than the video wait since
  # there is nothing to encode.
  reply_ready_timeout_seconds: 45
  reply_ready_interval_seconds: 3

instagram:
  # Instagram Reels publishing (Instagram API with Instagram Login: professional
  # account required, no linked Facebook Page). Same container -> poll ->
  # publish flow as Threads, so the same knobs.
  publish_poll_timeout_seconds: 600
  publish_poll_interval_seconds: 10

vertical:
  # 1080x1920 branded composite for Instagram Reels: hook text at the top, the
  # 16:9 clip full-width in the upper-middle, burned-in captions below it, and
  # the bottom kept clear of the Reels UI overlays. All layout lives here —
  # nothing is hardcoded in the ffmpeg filter graph.
  width: 1080
  height: 1920
  # Background = the clip itself scaled to fill the frame, blurred and
  # darkened. blur is the radius in full-frame pixels; brightness multiplies
  # the RGB channels (0 = black, 1 = untouched).
  background_blur: 32
  background_brightness: 0.55
  # SAFE ZONES. Instagram never shows the whole 1080x1920 frame:
  #  - full-screen Reels fills the height of a phone taller than 16:9, cropping
  #    roughly 100px off each side of a 1080-wide frame;
  #  - feed/grid surfaces crop to 4:5, keeping only y 285..1635.
  # Everything that must stay readable therefore lives inside that band, and
  # text is laid out across text_safe_frac of the width rather than edge to edge.
  text_safe_frac: 0.80
  # Top edge of the hook text block (it wraps/shrinks to fit above the video).
  # Starts below the 4:5 crop line so the hook survives feed and grid views.
  hook_y: 300
  # Top edge of the clip. A 16:9 source lands 1080x608, so it spans
  # video_y .. video_y+608. The gap above it is the hook's height budget
  # (video_y - hook_y - 20), so raising video_y gives the hook more room.
  video_y: 610
  # Top edge of the caption strip (word-by-word captions render from here down).
  caption_y: 1220
  # Height of the caption strip — deep enough for caption_max_lines lines.
  # caption_y + caption_strip_px should stay at or above height - bottom_safe_px.
  caption_strip_px: 350
  # Bottom band kept clear of platform UI (progress bar, actions, audio pill).
  bottom_safe_px: 350
  # Hook text styling (bundled Funnel weights; rendered by Pillow, not ffmpeg).
  hook_font_file: FunnelDisplay-ExtraBold.ttf
  hook_font_px: 126
  hook_text_color: "#FFFFFF"
  # Caption word size on the canvas (style/colors follow the `subtitles:` section).
  caption_font_px: 78
  # Words per caption phrase and how many lines they may wrap across. Phrases
  # fill each line to the safe width and break naturally (ragged right), so
  # ~9 words typically shows as three left-aligned lines.
  caption_max_words: 9
  caption_max_lines: 3

engagement:
  # HARD SCOPE LIMIT. The tool only ever reads/replies on the operator's own
  # posts. This flag exists but is HIGH-RISK and should stay false: enabling it
  # is documented as against the design intent and platform-risk posture.
  allow_other_users_posts: false
  # Pacing guardrails for replies (enforced at post time).
  # Note: these are OUR caps, not Threads'. Threads/Meta enforce their own
  # separate API rate limits (~250 posts+replies per 24h per user).
  max_replies_per_hour: 100
  max_replies_per_day: 250
  # Shared default LLM model id (captions, attribution drafts, etc.).
  draft_model: claude-sonnet-5
  # Hard ceiling given to the caption drafter — a backstop, not the goal. The
  # real instruction is the learned word target under `voice.learn_length`,
  # which follows the operator's recent captions. A ceiling alone doesn't work:
  # models spend whatever they're given, which is how drafts drifted long.
  # Raise this only if drafts come back clipped rather than merely brief.
  caption_max_chars: 140

scheduler:
  # Publish the FIFO queue at the fixed ET windows below, one post per window.
  # Disable to pause automatic publishing.
  enabled: true
  # All window times are interpreted in this zone (DST handled automatically).
  timezone: America/New_York
  # Active hours in the scheduler timezone (24h HH:MM). Outside this range the
  # scheduler never publishes.
  active_hours_start: "08:00"
  active_hours_end: "22:00"
  # Daily posting windows (local to timezone above). Tune later against insights.
  windows:
    - "10:00"
    - "13:00"
    - "19:00"
  # Retry a failed publish this many times (per tick) before marking the post
  # failed, with this delay between attempts. Guards against transient token /
  # Meta-processing hiccups on the day's first post. Set retries to 0 to disable.
  publish_retries: 1
  publish_retry_delay_seconds: 30
  # Never publish two posts less than this many minutes apart (any path).
  spacing_floor_minutes: 90
  # How often to re-pull insights for recently published posts. These dense
  # early samples feed the age-normalized comparisons in analytics.
  metrics_poll_interval_minutes: 15
  # Only poll posts published within this many hours at the frequent cadence;
  # older posts fall back to ``analytics.snapshot_interval_hours``.
  metrics_poll_recency_hours: 6

subtitles:
  # Stylized burned-in captions for exported clips (optional, per clip from the
  # Post step). The "talks Renewables.org" look: big lowercase Funnel words, a
  # few at a time, with the word being spoken set on a solid rounded box in
  # inverted colors.
  # Words shown on screen at once (fewer = bigger, more kinetic).
  max_words_per_group: 3
  # Bundled Funnel weights: FunnelDisplay-SemiBold.ttf / -Bold.ttf / -ExtraBold.ttf
  font_file: FunnelDisplay-SemiBold.ttf
  # Render captions in ALL CAPS (the reference series uses lowercase).
  uppercase: false
  # Base word color, the highlight box fill, and the word color inside the box
  # (defaults sampled from the talks Renewables.org series: navy #1A4A7D).
  text_color: "#FFFFFF"
  highlight_box_color: "#FFFFFF"
  highlight_text_color: "#1A4A7D"
  # Caption size as a fraction of video height (0.11 ≈ 120px at 1080p).
  font_size_frac: 0.11
  # Where captions sit on the frame: "bottom" (default) or "top".
  position: bottom
  # After the last word of a phrase, keep that caption on screen this many
  # seconds (or until the next phrase starts, whichever comes first). Stops
  # captions from vanishing the instant speech pauses.
  dwell_seconds: 2.0

analytics:
  # How often the metrics puller re-snapshots each post's stats (hours).
  snapshot_interval_hours: 12
  # Stop re-pulling metrics for posts older than this many days.
  max_post_age_days: 60
  # Model used for the written digest (Anthropic model ID).
  digest_model: claude-sonnet-5
  # Minimum posts before the digest is allowed to claim any pattern.
  min_sample_size: 8
